name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify publish contents
        run: npm run verify-pack

  example:
    runs-on: ubuntu-latest
    needs: library
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check example app
        working-directory: example
        run: npx tsc --noEmit

      - name: Expo project health check
        working-directory: example
        run: npx expo-doctor
